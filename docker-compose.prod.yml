# The production stack (constitution §1.8, §3.3): the SAME images that run on Azure, no bind mounts, secrets from
# .env.prod. The homelab runs this as production; locally it proves "if it runs here it runs on Azure".
#
#   cp .env.prod.example .env.prod          # fill the secrets
#   docker compose -f docker-compose.prod.yml pull        # the images CI published (ghcr.io/zzkool/af)
#   docker compose -f docker-compose.prod.yml up -d       # migrate runs first, then the app
#   ./scripts/backup.sh                                   # nightly via cron; ./scripts/restore.sh to test a backup
#
# Update = `AF_TAG=<sha-or-tag> docker compose -f docker-compose.prod.yml pull && … up -d` (docs/deployment.md).
# Build locally instead of pulling: `docker compose -f docker-compose.prod.yml build` (the same Dockerfile).
#
# Differences from docker-compose.yml (dev): one database, the published images, no ports published except the
# app, the documents in a volume on the box (`STORAGE_DRIVER=fs`, F107 / D61) — Azure Blob is the other driver
# (switch = `STORAGE_DRIVER=blob` + the connection string); Azurite is for dev only.
services:
  migrate:
    image: ${AF_IMAGE:-ghcr.io/zzkool/af}-migrate:${AF_TAG:-main}
    build:
      context: .
      target: migrate
    env_file: .env.prod
    environment:
      STORAGE_DRIVER: fs
      STORAGE_DIR: /data/documents
    volumes:
      - documents:/data/documents
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${AF_IMAGE:-ghcr.io/zzkool/af}:${AF_TAG:-main}
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_DRIVER: fs
      STORAGE_DIR: /data/documents
    volumes:
      - documents:/data/documents
    ports:
      - "${AF_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-af}
      POSTGRES_USER: ${POSTGRES_USER:-af}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-af} -d ${POSTGRES_DB:-af}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  documents:
