services:
  db-dev:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: af_dev
      POSTGRES_USER: af
      POSTGRES_PASSWORD: dev
    volumes:
      - db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af -d af_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: af_test
      POSTGRES_USER: af
      POSTGRES_PASSWORD: test
    volumes:
      - db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af -d af_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: >-
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      --skipApiVersionCheck
      --loose
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

# Volumes renamed with F46 (2026-10-22, `defterfab` → `af`): the old `pgdata-dev` / `pgdata-test` are left as they were —
# `docker volume rm af_pgdata-dev af_pgdata-test` once nothing in them is needed.
volumes:
  db-dev-data:
  db-test-data:
  azurite-data:
