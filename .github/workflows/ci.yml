name: CI/CD Pipeline
# Policy (phase-0): pull requests run lint, typecheck, unit tests and the production build (~3–4 min).
# E2E (Playwright + Azurite + seeded DB) runs on every push to main and on manual dispatch — fix-forward if red.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_bmad*/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  AUTH_SECRET: 'ci-test-secret-not-for-production'
  AUTH_URL: 'http://localhost:3000'
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  unit-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: defterfab
          POSTGRES_PASSWORD: test
          POSTGRES_DB: defterfab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U defterfab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://defterfab_app:app@localhost:5433/defterfab_test
      DATABASE_MIGRATION_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run migrations (superuser)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
      # Hand-written migrations are the truth and the schema must describe them (constitution §3.1):
      # diff the migrated database against prisma/schema; any difference fails the job and is posted
      # as an annotation so it can be read without opening the logs.
      - name: Schema ↔ migrations drift check
        run: |
          set +e
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code > drift.txt 2>&1
          code=$?
          set -e
          if [ "$code" = "0" ]; then echo "no drift"; exit 0; fi
          title="Schema drift"; [ "$code" != "2" ] && title="Drift check failed (exit $code)"
          echo "::error title=${title}::$(sed ':a;N;$!ba;s/\n/%0A/g' drift.txt | cut -c1-4000)"
          cat drift.txt
          exit 1
        env:
          DATABASE_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
          DATABASE_MIGRATION_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
      - run: npm run test

  build-and-e2e:
    needs: [lint, typecheck, unit-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: defterfab
          POSTGRES_PASSWORD: test
          POSTGRES_DB: defterfab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U defterfab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://defterfab_app:app@localhost:5433/defterfab_test
      DATABASE_MIGRATION_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
      AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;'
      AZURE_STORAGE_CONTAINER: documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Build without standalone (for next start + E2E)
        run: npm run build
        env:
          NEXT_OUTPUT_STANDALONE: 'false'
      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Run migrations (superuser)
        run: npx prisma migrate deploy
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
      - name: Seed database (superuser)
        if: github.event_name != 'pull_request'
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://defterfab:test@localhost:5433/defterfab_test
      - name: Start Azurite blob storage
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          npx wait-on tcp:10000 --timeout 10000
      - name: Create Azurite blob container
        if: github.event_name != 'pull_request'
        run: node -e "const{BlobServiceClient}=require('@azure/storage-blob');BlobServiceClient.fromConnectionString(process.env.AZURE_STORAGE_CONNECTION_STRING).getContainerClient(process.env.AZURE_STORAGE_CONTAINER).createIfNotExists().then(r=>console.log('Container ready:',r.succeeded?'created':'exists'))"
      - name: Start server and run E2E tests
        if: github.event_name != 'pull_request'
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 30000 || (cat server.log && exit 1)
          npm run e2e
        env:
          PORT: 3000
          HOSTNAME: localhost
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            server.log
          retention-days: 7

  # Deploy job — DISABLED until Azure is provisioned
  # To enable:
  #   1. Provision Azure Container Apps + ACR
  #   2. Add GitHub secrets: AZURE_CREDENTIALS, ACR_LOGIN_SERVER, ACR_USERNAME,
  #      ACR_PASSWORD, AZURE_RESOURCE_GROUP, PRODUCTION_DATABASE_URL
  #   3. Change 'if: false' to 'if: github.ref == 'refs/heads/main' && github.event_name == 'push''
  deploy:
    needs: [build-and-e2e]
    if: false # TODO: Enable when Azure is provisioned
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Run database migrations
        run: |
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/defterfab:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/defterfab:${{ github.sha }}
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name defterfab \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/defterfab:${{ github.sha }}
