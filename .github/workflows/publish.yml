# The images (constitution §1.8: one image everywhere). Every push to main and every `v*` tag builds the app
# image and the one-shot migrate image and publishes them to GitHub's registry — the homelab and Azure pull,
# never build. Tags: `main` (moving), `sha-<short>` (every build), `v1.2.3` (a release tag).
name: publish

on:
  push:
    branches: [main]
    tags: ['v*'] # tag pushes ignore paths-ignore: a release tag always builds
    paths-ignore: # a docs-only commit changes nothing in the image
      - '**.md'
      - 'docs/**'
      - '_bmad*/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/af

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          short=$(git rev-parse --short=12 "$GITHUB_SHA")
          echo "short=$short" >> "$GITHUB_OUTPUT"
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=$image:${GITHUB_REF#refs/tags/},$image:sha-$short" >> "$GITHUB_OUTPUT"
            echo "mtags=$image-migrate:${GITHUB_REF#refs/tags/},$image-migrate:sha-$short" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main,$image:sha-$short" >> "$GITHUB_OUTPUT"
            echo "mtags=$image-migrate:main,$image-migrate:sha-$short" >> "$GITHUB_OUTPUT"
            echo "version=sha-$short" >> "$GITHUB_OUTPUT"
          fi
      # the image must boot before it is published: a dependency can break the standalone output while every
      # PR check stays green (playwright-core 1.64, 2026-10-24 — the app answered 500 on every request)
      - name: app image (local, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: af-smoke:local
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      - name: smoke — the image boots and /api/health answers JSON
        run: |
          docker run -d --name smoke -p 3000:3000 -e JOBS_DISABLED=1 \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:1/smoke \
            -e AUTH_SECRET=smoke-smoke-smoke-smoke-smoke-smoke-32 -e AUTH_URL=http://127.0.0.1:3000 \
            af-smoke:local
          body=""
          for i in $(seq 1 30); do body=$(curl -s localhost:3000/api/health || true); [ -n "$body" ] && break; sleep 2; done
          echo "health: $body"; docker logs smoke 2>&1 | tail -20
          # 200 ok or 503 "db down" both prove a booted app (no database here); "Internal Server Error" does not
          echo "$body" | grep -q '"status"'
      - name: app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.meta.outputs.mtags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
