# F52 — weekly updates; minor + patch grouped into one PR per ecosystem, majors one PR each (read the changelog).
# Security updates are a repository setting (Settings → Code security → Dependabot security updates), not this file.
# Each update PR goes through the same gate as any PR (CI); package.json is a "never together" file — merge one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native rewrite; held until Next.js and the tooling support it (F52, 2026-10-24).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node we run (CI / Dockerfile), not the newest Node — majors move with that infra PR.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
